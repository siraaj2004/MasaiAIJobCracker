name: Neural Voice Render

# Renders ALL missing lecture videos with the Microsoft Edge NEURAL Telugu
# voice (te-IN-MohanNeural, male, human-like) on GitHub's runners, where the
# voice server is reachable, and COMMITS them to neural/ in this repo so the
# daily delivery step can attach them. The delivery crons are NEURAL-ONLY
# (user choice 2026-10-26): they never send a robotic local gTTS video.
#
# Runs ~15 minutes before each daily delivery slot (09:50 / 12:50 / 17:50 /
# 21:50 IST), plus manual dispatch. The batch script skips lectures that
# already have a neural video, so re-runs only fill gaps.
# Requires data/app.db in the repo (lecture summaries).
# The render script is neural-only: if the voice server cannot be reached
# it stops and changes nothing, so a green run means the neural voice was
# genuinely used.
on:
  schedule:
    - cron: "5 4 * * *"    # 09:35 IST -> for the 10:00 delivery
    - cron: "5 7 * * *"    # 12:35 IST -> for the 13:00 delivery
    - cron: "5 12 * * *"   # 17:35 IST -> for the 18:00 delivery
    - cron: "5 16 * * *"   # 21:35 IST -> for the 22:00 delivery
  workflow_dispatch:
    inputs:
      lecture:
        description: "Lecture id to render, or 'all' (all = every missing lecture)"
        required: true
        default: "all"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check lecture data is present
        run: |
          if [ ! -f data/app.db ]; then
            echo "data/app.db is missing from the repo - the render needs the lecture database."
            exit 1
          fi
          ls -la data/app.db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install -q -r requirements.txt
          ffmpeg -version | head -1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Render missing videos with the neural Telugu voice
        env:
          TELUGU_VOICE: te-IN-MohanNeural
        run: |
          if [ "${{ inputs.lecture }}" = "all" ] || [ -z "${{ inputs.lecture }}" ]; then
            python scripts/render_neural_batch.py
          else
            python scripts/rerender_neural.py --only "${{ inputs.lecture }}"
            cp "storage/lecture_${{ inputs.lecture }}/lesson.mp4" "neural/lecture_${{ inputs.lecture }}.mp4" || true
          fi

      - name: Commit neural videos to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # NOTE: the repo .gitignore has "*.mp4", so a plain `git add neural/`
          # silently skips the videos. Force-add so the rendered MP4s are committed.
          git add -f neural/
          if git diff --cached --quiet; then
            echo "No new neural video to commit."
          else
            git commit -m "Neural-voice (Mohan) videos for daily delivery"
            git push
          fi

      - name: Upload rendered videos as backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-voice-videos
          path: |
            neural/lecture_*.mp4
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
